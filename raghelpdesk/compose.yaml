services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=raghelpdesk'
      - 'MYSQL_PASSWORD=1234567890'
      - 'MYSQL_ROOT_PASSWORD=1234567890'
      - 'MYSQL_USER=root'
    ports:
      - '3307:3306'
    volumes:
      - 'mysql_data:/var/lib/mysql'

  qdrant:
    image: 'qdrant/qdrant:latest'
    ports:
      - '6334:6334'
      - '6333:6333'
    volumes:
      - 'qdrant_data:/qdrant/storage'

volumes:
  mysql_data:
  qdrant_data: